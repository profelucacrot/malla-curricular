<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visualizador de Malla</title><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><link rel="stylesheet" href="assets/style.css"></head><body>
<header><div class="brand">Visualizador de Malla</div><nav><span class="pill" id="meta">Cargando...</span><a class="btn primary" href="editor.html">Editar asignaturas</a><button class="btn" id="reload">Recargar</button><button class="btn" id="reset">Volver al CSV base</button></nav></header>
<main class="layout"><section class="panel"><div class="grid" id="malla"></div></section><aside class="panel side"><h3>Resumen por áreas</h3><table><thead><tr><th>Área</th><th>Asig.</th><th>Créditos</th><th>%</th></tr></thead><tbody id="summary"></tbody></table><h3>Leyenda</h3><div id="legend" class="legend"></div><p class="muted">Pasa el mouse sobre una asignatura para destacar prerrequisitos y dependientes. Haz clic para ver detalle.</p></aside></main>
<div class="modalBackdrop" id="modalBackdrop"></div><div class="modal" id="modal"><div class="panel"><header style="position:static;background:transparent;border:0;padding:0 0 12px"><b id="modalTitle"></b><button class="btn" onclick="modalBackdrop.style.display=modal.style.display='none'">Cerrar</button></header><div id="modalBody"></div></div></div>
<script src="assets/app.js"></script><script>
let rows=[]; async function boot(){rows=await loadRows(); renderMalla(rows,document.getElementById("malla"),id=>openCourseModal(rows,id)); renderSummary(rows,document.getElementById("summary"),document.getElementById("meta")); buildLegend(document.getElementById("legend"))}
document.getElementById("reload").onclick=boot; document.getElementById("reset").onclick=()=>{clearRows();boot()};
window.addEventListener("storage",e=>{if(e.key===STORAGE_KEY)boot()}); window.addEventListener("malla-data-changed",boot); boot();
</script></body></html>
