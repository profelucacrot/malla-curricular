<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Visualizador de Malla · Firebase</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <div style="display:flex; flex-direction:column; gap:4px;">
    <h1 style="margin:0;">Visualizador de Malla Curricular</h1>
    <div style="
      font-size:14px;
      opacity:.75;
      font-weight:500;
      letter-spacing:.3px;">
    Desarrollado por GErardo PÉrez TEllo y Luis Cabrera Crot
    </div>
  </div>
  <nav>
    <span class="pill" id="meta">Conectando...</span>
    <span class="pill" id="sourceInfo">Fuente: Firebase</span>
    <a class="btn primary" href="editor.html">Editar asignaturas</a>
    <button class="btn" id="zoomOut">− Zoom</button>
    <span class="pill" id="zoomLabel">100%</span>
    <button class="btn" id="zoomIn">+ Zoom</button>
    <button class="btn" id="reload">Recargar datos</button>
    <button class="btn" id="fullscreenBtn">Pantalla completa</button>
    <button class="btn" id="exportPdf">Exportar PDF</button>
  </nav>
</header>

<main class="layout">
  <section class="panel malla-panel">
    <div id="zoomRoot" class="zoom-root">
      <div class="grid" id="malla"></div>
    </div>
  </section>
  <aside class="panel side">
    <h3>Resumen por áreas</h3>
    <table>
      <thead><tr><th>Área</th><th>Asig.</th><th>Créditos</th><th>%</th></tr></thead>
      <tbody id="summary"></tbody>
    </table>
    <h3>Leyenda</h3>
    <div id="legend" class="legend"></div>
    <p class="muted">Esta página escucha Firebase en tiempo real. Si algo no aparece, usa <b>Recargar datos</b>.</p>
  </aside>
</main>

<div class="modalBackdrop" id="modalBackdrop"></div>
<div class="modal" id="modal">
  <div class="panel">
    <header style="position:static;background:transparent;border:0;padding:0 0 12px">
      <b id="modalTitle"></b>
      <button class="btn" onclick="modalBackdrop.style.display=modal.style.display='none'">Cerrar</button>
    </header>
    <div id="modalBody"></div>
  </div>
</div>

<script src="assets/app.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
  import { firebaseConfig, DB_PATH } from "./assets/firebase-config.js";

  let rows = [];
  let zoom = 1;
  let dbRef = null;

  function setZoom(next){
    zoom = Math.max(0.5, Math.min(1.8, next));
    const zr = document.getElementById("zoomRoot");
    zr.style.transform = `scale(${zoom})`;
    zr.style.width = `${100/zoom}%`;
    document.getElementById("zoomLabel").textContent = `${Math.round(zoom*100)}%`;
  }

  function draw(){
    renderMalla(rows, document.getElementById("malla"), id => openCourseModal(rows,id));
    renderSummary(rows, document.getElementById("summary"), document.getElementById("meta"));
    buildLegend(document.getElementById("legend"));
    setZoom(zoom);
  }

  async function reloadOnce(){
    if(!dbRef) return;
    document.getElementById("sourceInfo").textContent = "Recargando desde Firebase...";
    const snap = await get(dbRef);
    rows = snap.exists() ? Object.values(snap.val() || {}) : [];
    draw();
    document.getElementById("sourceInfo").textContent = "Fuente: Firebase · " + new Date().toLocaleTimeString();
  }

  document.getElementById("exportPdf").onclick = async () => {
    const panel = document.querySelector(".malla-panel");
    const zoomRoot = document.getElementById("zoomRoot");
  
    const oldTransform = zoomRoot.style.transform;
    const oldWidth = zoomRoot.style.width;
    const oldPanelOverflow = panel.style.overflow;
    const oldPanelWidth = panel.style.width;
    const oldPanelHeight = panel.style.height;
  
    // Quitar zoom y expandir temporalmente el panel
    zoomRoot.style.transform = "scale(1)";
    zoomRoot.style.width = "max-content";
  
    panel.style.overflow = "visible";
    panel.style.width = zoomRoot.scrollWidth + "px";
    panel.style.height = zoomRoot.scrollHeight + "px";
  
    await new Promise(resolve => requestAnimationFrame(resolve));
  
    const canvas = await html2canvas(zoomRoot, {
      backgroundColor: "#0b0f14",
      scale: 2,
      useCORS: true,
      width: zoomRoot.scrollWidth,
      height: zoomRoot.scrollHeight,
      windowWidth: zoomRoot.scrollWidth,
      windowHeight: zoomRoot.scrollHeight
    });
  
    const imgData = canvas.toDataURL("image/png");
  
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      orientation: "landscape",
      unit: "pt",
      format: "a4"
    });
  
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
  
    const imgW = canvas.width;
    const imgH = canvas.height;
  
    const ratio = Math.min(pageW / imgW, pageH / imgH);
  
    const drawW = imgW * ratio;
    const drawH = imgH * ratio;
  
    const x = (pageW - drawW) / 2;
    const y = (pageH - drawH) / 2;
  
    pdf.addImage(imgData, "PNG", x, y, drawW, drawH);
    pdf.save("malla_curricular.pdf");
  
    // Restaurar estado anterior
    zoomRoot.style.transform = oldTransform;
    zoomRoot.style.width = oldWidth;
    panel.style.overflow = oldPanelOverflow;
    panel.style.width = oldPanelWidth;
    panel.style.height = oldPanelHeight;
  };
  
  function boot(){
    try{
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      dbRef = ref(db, DB_PATH);

      onValue(dbRef, snap => {
        rows = snap.exists() ? Object.values(snap.val() || {}) : [];
        draw();
        document.getElementById("sourceInfo").textContent = "Firebase conectado · " + new Date().toLocaleTimeString();
      }, err => {
        document.getElementById("sourceInfo").textContent = "Error Firebase";
        alert("No se pudo leer Firebase: " + err.message);
      });
    }catch(err){
      document.getElementById("sourceInfo").textContent = "Falta configurar Firebase";
      alert("Revisa assets/firebase-config.js\n\n" + err.message);
    }
  }

  document.getElementById("zoomOut").onclick = () => setZoom(zoom - 0.1);
  document.getElementById("zoomIn").onclick = () => setZoom(zoom + 0.1);
  document.getElementById("reload").onclick = reloadOnce;

  const fullscreenBtn = document.getElementById("fullscreenBtn");
  fullscreenBtn.onclick = async () => {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen?.();
      fullscreenBtn.textContent = "Salir de pantalla completa";
    } else {
      await document.exitFullscreen?.();
      fullscreenBtn.textContent = "Pantalla completa";
    }
  };
  document.addEventListener("fullscreenchange", () => {
    const isFull = !!document.fullscreenElement;
    fullscreenBtn.textContent = isFull ? "Salir de pantalla completa" : "Pantalla completa";
    document.body.classList.toggle("fullscreen-mode", isFull);
  });

  boot();
</script>
</body>
</html>
